name: SQLMesh PR Plan - Team A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'models/**'
      - 'seeds/**'
      - 'macros/**'
      - 'audits/**'
      - 'tests/**'
      - 'config.yaml'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLMesh
        run: |
          pip install sqlmesh[trino]

      - name: Run SQLMesh Plan (Play)
        id: plan-play
        env:
          SQLMESH_GATEWAY__TRINO__CONNECTION__HOST: ${{ secrets.TRINO_HOST || 'localhost' }}
          SQLMESH_GATEWAY__TRINO__CONNECTION__PORT: ${{ secrets.TRINO_PORT || '8060' }}
          SQLMESH_GATEWAY__TRINO__CONNECTION__USER: ${{ secrets.TRINO_USER || 'admin' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__USER: ${{ secrets.POSTGRES_USER || 'ngods' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ngods' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__DATABASE: ${{ secrets.POSTGRES_DATABASE || 'sqlmesh_state' }}
        run: |
          sqlmesh plan team_a_play --no-apply > plan-play-output.txt 2>&1 || true
          echo "plan_play_output<<EOF" >> $GITHUB_OUTPUT
          cat plan-play-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run SQLMesh Plan (Svc)
        id: plan-svc
        env:
          SQLMESH_GATEWAY__TRINO__CONNECTION__HOST: ${{ secrets.TRINO_HOST || 'localhost' }}
          SQLMESH_GATEWAY__TRINO__CONNECTION__PORT: ${{ secrets.TRINO_PORT || '8060' }}
          SQLMESH_GATEWAY__TRINO__CONNECTION__USER: ${{ secrets.TRINO_USER || 'admin' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__USER: ${{ secrets.POSTGRES_USER || 'ngods' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ngods' }}
          SQLMESH_GATEWAY__TRINO__STATE_CONNECTION__DATABASE: ${{ secrets.POSTGRES_DATABASE || 'sqlmesh_state' }}
        run: |
          sqlmesh plan team_a_svc --no-apply > plan-svc-output.txt 2>&1 || true
          echo "plan_svc_output<<EOF" >> $GITHUB_OUTPUT
          cat plan-svc-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR with Plan Results
        uses: actions/github-script@v7
        env:
          PLAN_PLAY_OUTPUT: ${{ steps.plan-play.outputs.plan_play_output }}
          PLAN_SVC_OUTPUT: ${{ steps.plan-svc.outputs.plan_svc_output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const planPlayOutput = process.env.PLAN_PLAY_OUTPUT || '';
            const planSvcOutput = process.env.PLAN_SVC_OUTPUT || '';
            
            let comment = '## 🔍 SQLMesh Plan Results for Team A\n\n';
            
            if (planPlayOutput && planPlayOutput.trim()) {
              comment += '### 📊 Play Environment (team_a_play)\n\n';
              comment += '```\n' + planPlayOutput + '\n```\n\n';
            }
            
            if (planSvcOutput && planSvcOutput.trim()) {
              comment += '### 🚀 Svc Environment (team_a_svc)\n\n';
              comment += '```\n' + planSvcOutput + '\n```\n\n';
            }
            
            if (!planPlayOutput && !planSvcOutput) {
              comment += '⚠️ No plan output available.\n';
            }
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SQLMesh Plan Results for Team A')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

