name: SQLMesh PR Summary - Team A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'models/**'
      - 'seeds/**'
      - 'macros/**'
      - 'audits/**'
      - 'tests/**'
      - 'config.yaml'

jobs:
  pr-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Get Changed Files and Summary
        id: get-changes
        run: |
          # Get base and head SHA
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-status $BASE_SHA $HEAD_SHA | grep -E '\.(sql|yaml|yml|py)$' || echo "")
          
          # Initialize counters
          MODELS_CHANGED=0
          SEEDS_CHANGED=0
          MACROS_CHANGED=0
          AUDITS_CHANGED=0
          TESTS_CHANGED=0
          CONFIG_CHANGED=0
          FILE_LIST=""
          
          # Count changes using wc -l (more reliable)
          if [ -n "$CHANGED_FILES" ]; then
            MODELS_COUNT=$(echo "$CHANGED_FILES" | grep "models/" | wc -l)
            SEEDS_COUNT=$(echo "$CHANGED_FILES" | grep "seeds/" | wc -l)
            MACROS_COUNT=$(echo "$CHANGED_FILES" | grep "macros/" | wc -l)
            AUDITS_COUNT=$(echo "$CHANGED_FILES" | grep "audits/" | wc -l)
            TESTS_COUNT=$(echo "$CHANGED_FILES" | grep "tests/" | wc -l)
            CONFIG_COUNT=$(echo "$CHANGED_FILES" | grep "config.yaml" | wc -l)
            
            # Convert to numbers (remove leading spaces)
            MODELS_CHANGED=$((MODELS_COUNT))
            SEEDS_CHANGED=$((SEEDS_COUNT))
            MACROS_CHANGED=$((MACROS_COUNT))
            AUDITS_CHANGED=$((AUDITS_COUNT))
            TESTS_CHANGED=$((TESTS_COUNT))
            CONFIG_CHANGED=$((CONFIG_COUNT))
            
            # Get file list
            FILE_LIST=$(echo "$CHANGED_FILES" | awk '{print $2}' | grep -E '\.(sql|yaml|yml|py)$' || echo "")
          fi
          
          # Save to output - use simple format for numbers, multiline for file list
          echo "models_changed=${MODELS_CHANGED}" >> $GITHUB_OUTPUT
          echo "seeds_changed=${SEEDS_CHANGED}" >> $GITHUB_OUTPUT
          echo "macros_changed=${MACROS_CHANGED}" >> $GITHUB_OUTPUT
          echo "audits_changed=${AUDITS_CHANGED}" >> $GITHUB_OUTPUT
          echo "tests_changed=${TESTS_CHANGED}" >> $GITHUB_OUTPUT
          echo "config_changed=${CONFIG_CHANGED}" >> $GITHUB_OUTPUT
          
          # Use multiline format only for file list
          {
            echo "changed_files<<EOF"
            echo "$FILE_LIST"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Get Code Diff Summary
        id: get-diff
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          
          # Get summary of changes (first 50 lines of diff)
          DIFF_SUMMARY=$(git diff $BASE_SHA $HEAD_SHA --stat || echo "")
          
          {
            echo "diff_summary<<EOF"
            echo "$DIFF_SUMMARY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment PR with Changes Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changedFiles = `${{ steps.get-changes.outputs.changed_files }}`.trim();
            const modelsChanged = `${{ steps.get-changes.outputs.models_changed }}`;
            const seedsChanged = `${{ steps.get-changes.outputs.seeds_changed }}`;
            const macrosChanged = `${{ steps.get-changes.outputs.macros_changed }}`;
            const auditsChanged = `${{ steps.get-changes.outputs.audits_changed }}`;
            const testsChanged = `${{ steps.get-changes.outputs.tests_changed }}`;
            const configChanged = `${{ steps.get-changes.outputs.config_changed }}`;
            const diffSummary = `${{ steps.get-diff.outputs.diff_summary }}`.trim();
            
            let comment = '## 📋 SQLMesh Changes Summary for Team A\n\n';
            
            // Summary statistics
            comment += '### 📊 Change Statistics\n\n';
            comment += '| Type | Count |\n';
            comment += '|------|-------|\n';
            if (modelsChanged !== '0') comment += `| 📦 Models | ${modelsChanged} |\n`;
            if (seedsChanged !== '0') comment += `| 🌱 Seeds | ${seedsChanged} |\n`;
            if (macrosChanged !== '0') comment += `| 🔧 Macros | ${macrosChanged} |\n`;
            if (auditsChanged !== '0') comment += `| ✅ Audits | ${auditsChanged} |\n`;
            if (testsChanged !== '0') comment += `| 🧪 Tests | ${testsChanged} |\n`;
            if (configChanged !== '0') comment += `| ⚙️ Config | ${configChanged} |\n`;
            comment += '\n';
            
            // Changed files list
            if (changedFiles) {
              const files = changedFiles.split('\n').filter(f => f.trim());
              if (files.length > 0) {
                comment += '### 📝 Changed Files\n\n';
                files.forEach(file => {
                  comment += `- \`${file}\`\n`;
                });
                comment += '\n';
              }
            }
            
            // Diff summary
            if (diffSummary) {
              comment += '### 📈 Change Summary\n\n';
              comment += '```\n' + diffSummary + '\n```\n';
            }
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SQLMesh Changes Summary for Team A')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

