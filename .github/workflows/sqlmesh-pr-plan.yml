name: SQLMesh PR Summary - Team A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'models/**'
      - 'seeds/**'
      - 'macros/**'
      - 'audits/**'
      - 'tests/**'
      - 'config.yaml'

jobs:
  pr-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Get Changed Files and Code Diffs
        id: get-changes
        run: |
          # Get base and head SHA
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          
          # Get changed files in specific directories only
          # git diff --name-status output format: "A    path/to/file" or "M    path/to/file"
          CHANGED_FILES=$(git diff --name-status $BASE_SHA $HEAD_SHA | grep -E '^[AMD]\s+(audits|logs|macros|models|seeds|tests)/.*\.(sql|yaml|yml|py)$' || echo "")
          
          # Debug: print changed files
          echo "Changed files found:"
          echo "$CHANGED_FILES"
          
          # Initialize counters
          MODELS_CHANGED=0
          SEEDS_CHANGED=0
          MACROS_CHANGED=0
          AUDITS_CHANGED=0
          TESTS_CHANGED=0
          LOGS_CHANGED=0
          
          # Count changes
          if [ -n "$CHANGED_FILES" ]; then
            MODELS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+models/' | wc -l | tr -d ' ')
            SEEDS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+seeds/' | wc -l | tr -d ' ')
            MACROS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+macros/' | wc -l | tr -d ' ')
            AUDITS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+audits/' | wc -l | tr -d ' ')
            TESTS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+tests/' | wc -l | tr -d ' ')
            LOGS_COUNT=$(echo "$CHANGED_FILES" | grep -E '\s+logs/' | wc -l | tr -d ' ')
            
            MODELS_CHANGED=$((MODELS_COUNT))
            SEEDS_CHANGED=$((SEEDS_COUNT))
            MACROS_CHANGED=$((MACROS_COUNT))
            AUDITS_CHANGED=$((AUDITS_COUNT))
            TESTS_CHANGED=$((TESTS_COUNT))
            LOGS_CHANGED=$((LOGS_COUNT))
          fi
          
          # Get file list and generate diffs
          FILE_DIFFS=""
          if [ -n "$CHANGED_FILES" ]; then
            while IFS= read -r line; do
              if [ -z "$line" ]; then
                continue
              fi
              
              # Extract status and file path (handle both tab and space separators)
              STATUS=$(echo "$line" | awk '{print $1}')
              # Remove status and leading whitespace to get file path
              FILE_PATH=$(echo "$line" | sed 's/^[AMD][[:space:]]*//' | sed 's/^[[:space:]]*//')
              
              if [ -n "$FILE_PATH" ] && [ "$FILE_PATH" != "$STATUS" ]; then
                # Get diff for this file
                FULL_DIFF=$(git diff $BASE_SHA $HEAD_SHA -- "$FILE_PATH" 2>/dev/null || echo "")
                
                if [ -n "$FULL_DIFF" ]; then
                  # Count lines
                  LINE_COUNT=$(echo "$FULL_DIFF" | wc -l | tr -d ' ')
                  
                  # Limit to 50 lines
                  if [ "$LINE_COUNT" -gt 50 ]; then
                    FILE_DIFF=$(echo "$FULL_DIFF" | head -n 50)
                    TRUNCATE_MSG="... (truncated, total ${LINE_COUNT} lines)"
                    FILE_DIFF="${FILE_DIFF}"$'\n'"${TRUNCATE_MSG}"
                  else
                    FILE_DIFF="$FULL_DIFF"
                  fi
                  
                  # Add to output with delimiter
                  FILE_DIFFS="${FILE_DIFFS}FILE_START:${FILE_PATH}"$'\n'"${FILE_DIFF}"$'\n'"FILE_END:${FILE_PATH}"$'\n'
                fi
              fi
            done <<< "$CHANGED_FILES"
          fi
          
          # Save to output
          echo "models_changed=${MODELS_CHANGED}" >> $GITHUB_OUTPUT
          echo "seeds_changed=${SEEDS_CHANGED}" >> $GITHUB_OUTPUT
          echo "macros_changed=${MACROS_CHANGED}" >> $GITHUB_OUTPUT
          echo "audits_changed=${AUDITS_CHANGED}" >> $GITHUB_OUTPUT
          echo "tests_changed=${TESTS_CHANGED}" >> $GITHUB_OUTPUT
          echo "logs_changed=${LOGS_CHANGED}" >> $GITHUB_OUTPUT
          
          {
            echo "file_diffs<<EOF"
            echo -n "$FILE_DIFFS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment PR with Changes Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const modelsChanged = parseInt(`${{ steps.get-changes.outputs.models_changed }}`) || 0;
            const seedsChanged = parseInt(`${{ steps.get-changes.outputs.seeds_changed }}`) || 0;
            const macrosChanged = parseInt(`${{ steps.get-changes.outputs.macros_changed }}`) || 0;
            const auditsChanged = parseInt(`${{ steps.get-changes.outputs.audits_changed }}`) || 0;
            const testsChanged = parseInt(`${{ steps.get-changes.outputs.tests_changed }}`) || 0;
            const logsChanged = parseInt(`${{ steps.get-changes.outputs.logs_changed }}`) || 0;
            const fileDiffs = `${{ steps.get-changes.outputs.file_diffs }}`.trim();
            
            // Calculate total changes
            const totalChanges = modelsChanged + seedsChanged + macrosChanged + auditsChanged + testsChanged + logsChanged;
            
            // Directory labels (same format as used below)
            const dirLabels = {
              'models': '📦 Models',
              'seeds': '🌱 Seeds',
              'macros': '🔧 Macros',
              'audits': '✅ Audits',
              'tests': '🧪 Tests',
              'logs': '📋 Logs'
            };
            
            // Directory counts
            const dirCounts = {
              'models': modelsChanged,
              'seeds': seedsChanged,
              'macros': macrosChanged,
              'audits': auditsChanged,
              'tests': testsChanged,
              'logs': logsChanged
            };
            
            let comment = '## 📋 SQLMesh Changes Summary for Team A\n\n';
            
            // Generate summary table
            comment += '### 변경사항\n\n';
            
            if (totalChanges > 0) {
              comment += '| 타입 | 개수 |\n';
              comment += '|------|------|\n';
              Object.keys(dirLabels).forEach(dir => {
                if (dirCounts[dir] > 0) {
                  comment += `| ${dirLabels[dir]} | ${dirCounts[dir]} |\n`;
                }
              });
            } else {
              comment += '**변경된 파일이 없습니다.**\n';
            }
            
            comment += '\n';
            
            // Organize by directory
            const diffsByDir = {
              'models': [],
              'seeds': [],
              'macros': [],
              'audits': [],
              'tests': [],
              'logs': []
            };
            
            if (fileDiffs) {
              const fileBlocks = fileDiffs.split('FILE_START:');
              fileBlocks.forEach(block => {
                if (!block.trim()) return;
                const lines = block.split('\n');
                const filePath = lines[0].trim();
                const diffContent = lines.slice(1).join('\n').replace(/FILE_END:.*$/m, '').trim();
                
                if (filePath.startsWith('models/')) {
                  diffsByDir.models.push({ path: filePath, diff: diffContent });
                } else if (filePath.startsWith('seeds/')) {
                  diffsByDir.seeds.push({ path: filePath, diff: diffContent });
                } else if (filePath.startsWith('macros/')) {
                  diffsByDir.macros.push({ path: filePath, diff: diffContent });
                } else if (filePath.startsWith('audits/')) {
                  diffsByDir.audits.push({ path: filePath, diff: diffContent });
                } else if (filePath.startsWith('tests/')) {
                  diffsByDir.tests.push({ path: filePath, diff: diffContent });
                } else if (filePath.startsWith('logs/')) {
                  diffsByDir.logs.push({ path: filePath, diff: diffContent });
                }
              });
            }
            
            // Display by directory
            Object.keys(diffsByDir).forEach(dir => {
              if (diffsByDir[dir].length > 0) {
                comment += `### ${dirLabels[dir]}\n\n`;
                diffsByDir[dir].forEach(({ path, diff }) => {
                  comment += `#### \`${path}\`\n\n`;
                  comment += '```diff\n' + diff + '\n```\n\n';
                });
              }
            });
            
            if (totalChanges === 0) {
              comment += '변경된 파일이 없습니다.\n';
            }
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SQLMesh Changes Summary for Team A')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

